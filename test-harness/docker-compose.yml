services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: cuft-choice-zone-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp-network
    ports:
      - "${MYSQL_PORT}:3306"

  # WordPress
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: cuft-choice-zone-wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DEBUG: "${WORDPRESS_DEBUG}"
      WORDPRESS_DEBUG_LOG: "${WORDPRESS_DEBUG_LOG}"
      WORDPRESS_DEBUG_DISPLAY: "${WORDPRESS_DEBUG_DISPLAY}"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('FS_METHOD', 'direct');
        @ini_set('display_errors', 0);
        // MailCatcher SMTP Configuration
        ini_set('SMTP', 'mailcatcher');
        ini_set('smtp_port', '1025');
        ini_set('sendmail_from', 'noreply@cuft.choice.zone');
        // SSL and hostname detection
        if (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
        if (!empty($$_SERVER['HTTP_X_FORWARDED_SSL']) && $$_SERVER['HTTP_X_FORWARDED_SSL'] === 'on') {
          $$_SERVER['HTTPS'] = 'on';
        }
        if (!empty($$_SERVER['HTTP_CLOUDFRONT_FORWARDED_PROTO']) && $$_SERVER['HTTP_CLOUDFRONT_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
        // Allow any hostname with proper protocol detection
        if (!empty($$_SERVER['HTTP_HOST'])) {
          $$protocol = (!empty($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] !== 'off') ? 'https://' : 'http://';
          define('WP_HOME', $$protocol . $$_SERVER['HTTP_HOST']);
          define('WP_SITEURL', $$protocol . $$_SERVER['HTTP_HOST']);
        }
        // Force SSL for admin and logins when HTTPS is detected
        if (!empty($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] !== 'off') {
          define('FORCE_SSL_ADMIN', true);
        }
    ports:
      - "${WORDPRESS_PORT}:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - wp-network

  # WP-CLI
  wpcli:
    depends_on:
      - db
      - wordpress
    image: wordpress:cli
    container_name: cuft-choice-zone-cli
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
    networks:
      - wp-network
    entrypoint: ["tail", "-f", "/dev/null"]

  # MailCatcher for email testing
  mailcatcher:
    image: schickling/mailcatcher:latest
    container_name: cuft-choice-zone-mailcatcher
    restart: unless-stopped
    ports:
      - "${MAILCATCHER_SMTP_PORT}:1025"
      - "${MAILCATCHER_WEB_PORT}:1080"
    networks:
      - wp-network

volumes:
  db_data:
  wordpress_data:

networks:
  wp-network:
    driver: bridge
